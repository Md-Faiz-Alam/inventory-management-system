name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory_ci
          POSTGRES_USER: inventory_ci
          POSTGRES_PASSWORD: inventory-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_ci -d inventory_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-key-for-disposable-tests-never-use-in-production-482
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: inventory_ci
      POSTGRES_USER: inventory_ci
      POSTGRES_PASSWORD: inventory-ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to fresh database
        run: python manage.py migrate --noinput

      - name: Run all tests
        run: python manage.py test --verbosity 2 --noinput

      - name: Collect static assets
        run: python manage.py collectstatic --noinput

      - name: Bootstrap demo data twice (must be idempotent)
        env:
          DEMO_ADMIN_PASSWORD: ci-demo-admin-pass-7731
          DEMO_MANAGER_PASSWORD: ci-demo-manager-pass-7731
          DEMO_STAFF_PASSWORD: ci-demo-staff-pass-7731
        run: |
          python manage.py bootstrap_demo
          python manage.py bootstrap_demo

      - name: Production deployment checks
        env:
          DJANGO_SECRET_KEY: ci-only-deploy-check-key-that-is-long-and-random-6b1f0f9a2c7d4e8b
          DJANGO_SECURE_HTTPS: "true"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Smoke test with Gunicorn
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 --daemon
          sleep 3
          curl --fail --silent http://127.0.0.1:8000/healthz/
          curl --fail --silent --output /dev/null -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/
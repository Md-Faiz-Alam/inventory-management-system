{% if page_obj.has_other_pages %}
    <nav class="catalog-pagination" aria-label="{{ label|default:'Result' }} pages">
        {% if page_obj.has_previous %}
            <a
                class="button button-quiet"
                href="?{{ pagination_query }}&page={{ page_obj.previous_page_number }}"
                hx-get="?{{ pagination_query }}&page={{ page_obj.previous_page_number }}"
                hx-target="#results"
                hx-swap="outerHTML"
                hx-push-url="true"
            >← Previous</a>
        {% endif %}
        <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a
                class="button button-quiet"
                href="?{{ pagination_query }}&page={{ page_obj.next_page_number }}"
                hx-get="?{{ pagination_query }}&page={{ page_obj.next_page_number }}"
                hx-target="#results"
                hx-swap="outerHTML"
                hx-push-url="true"
            >Next →</a>
        {% endif %}
    </nav>
{% endif %}
